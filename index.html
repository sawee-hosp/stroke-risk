<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวีรู้ทันสโตรก</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* --- Styles: Loading Animation --- */
        #loading { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 2000; 
            color: white; text-align: center; 
        }
        #loading-text { font-size: 2rem; font-weight: bold; margin-bottom: 20px; }
        #loading-subtext { 
            font-size: 3.5rem; /* ปรับขนาดให้พอดีหน้าจอมือถือ */
            font-weight: 800; color: #ffc107; min-height: 100px; 
            line-height: 1.2; text-shadow: 2px 2px 10px rgba(255,193,7,0.5); 
            opacity: 1; transition: opacity 0.5s ease-in-out; 
        }
        #loading-icon { 
            font-size: 5rem; color: #ffc107; margin-bottom: 30px; 
            animation: pulse 1s infinite; opacity: 1; transition: opacity 0.5s ease-in-out; 
        }
        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.2); } 
            100% { transform: scale(1); } 
        }

        /* --- Styles: Main Application (Large Fonts for Elderly) --- */
        body { 
            font-family: "Noto Sans Thai", sans-serif; 
            font-size: 22px; /* เพิ่มขนาด Base Font */
            background: #f5f5f5; padding: 10px; margin: 0; 
            line-height: 1.6;
        }
        .container { 
            max-width: 100%; margin: 0 auto; background: #fff; 
            padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
        }
        
        h1 { 
            font-size: 32px; /* หัวข้อใหญ่ */
            font-weight: 800; text-align: center; margin-bottom: 25px; 
            color: #003366; line-height: 1.3;
        }

        /* Form Elements Large Mode */
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            font-weight: 700; margin-bottom: 8px; display: block; 
            font-size: 24px; color: #333;
        }
        .form-group .input-wrapper { display: flex; flex-wrap: wrap; gap: 10px; }
        
        input[type="number"], input[type="text"], input[type="date"], select { 
            width: 100%; padding: 15px; font-size: 22px; 
            border-radius: 12px; border: 2px solid #ccc; 
            font-family: "Noto Sans Thai", sans-serif; 
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #007BFF; outline: none; }
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; }

        /* Radio & Checkbox Large Mode */
        .radio-group label, .checkbox-group label { 
            margin-right: 15px; display: flex; align-items: center; 
            cursor: pointer; font-weight: normal; font-size: 24px;
            padding: 5px 0;
        }
        input[type="radio"], input[type="checkbox"] { 
            transform: scale(2); /* ขยายขนาดปุ่มกด */
            margin-right: 15px; margin-left: 5px;
        }

        /* Highlight Box for Sawi Patient */
        #patientForm { 
            display: none; 
            border: 3px solid #f0ad4e; /* ขอบสีส้มอ่อน */
            background-color: #fff9c4; /* พื้นหลังสีเหลืองอ่อน */
            padding: 20px; margin-top: 15px; margin-bottom: 15px;
            border-radius: 15px; 
        }

        button { 
            display: block; width: 100%; padding: 20px; 
            font-size: 26px; font-weight: bold;
            color: white; background-color: #007BFF; 
            border: none; border-radius: 15px; cursor: pointer; 
            font-family: "Noto Sans Thai", sans-serif; margin-top: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }

        #result-container { margin-top: 30px; padding: 20px; border-top: 2px solid #eee; display: none; }
        #result-text { font-size: 22px; }
        
        .progress-bar-container { height: 40px; border-radius: 20px; background-color: #ddd; margin: 25px 0; }
        .progress-bar { font-size: 20px; line-height: 40px; border-radius: 20px; }

        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fefefe; margin: 30% auto; padding: 30px; border: 1px solid #888; width: 90%; max-width: 400px; border-radius: 15px; text-align: center; }
        .modal-content p { font-size: 24px; text-align: left; }
        
        #credit { font-size: 16px; color: #888; text-align: center; margin-top: 30px; }
        
        /* Specific tweaks */
        #stroke-date-wrapper { margin-top: 10px; margin-left: 45px; display: none; }
        small { font-size: 18px !important; color: #666; }
        .info-icon { transform: scale(1.5); margin-left: 10px; }
    </style>
</head>
<body>

    <div id="loading">
        <i id="loading-icon" class="bi bi-brain"></i>
        <div id="loading-text">กำลังโหลดข้อมูล...</div>
        <div style="font-size: 1.5rem;">จำใส่ใจอาการสโตรก:</div>
        <div id="loading-subtext"></div>
    </div>

    <div class="container">
        <h1>
            ประเมินความเสี่ยง<br>การเกิดสโตรก
            <span id="info-icon" class="info-icon" title="ข้อจำกัดความรับผิดชอบ">ℹ️</span>
        </h1>
        
        <div id="registration-status" style="font-size: 20px; color: #198754; font-weight: bold; text-align: center; margin-bottom: 15px; display: none;"></div>

        <form id="mainForm" onsubmit="return false;">
            <div class="form-group"> <label for="lineName">ชื่อ Line:</label> <input type="text" id="lineName" readonly> </div>
            
            <div class="form-group"> 
                <label for="role">ประเมินให้ใคร:</label> 
                <select id="role"> 
                    <option value="ประเมินตัวเอง" selected>ประเมินตัวเอง</option> 
                    <option value="ญาติ/ผู้ดูแลผู้ป่วย">ญาติ/ผู้ดูแลผู้ป่วย</option> 
                    <option value="จนท.สาธารณสุข">จนท.สาธารณสุข</option> 
                    <option value="อสม.สโตรก ประเมินให้คนอื่น">อสม.สโตรก ประเมินให้คนอื่น</option> 
                </select> 
            </div>
            
            <div class="form-group"> <label for="name">ชื่อผู้รับการประเมิน:</label> <input type="text" id="name" placeholder="ชื่อเล่น หรือ ชื่อจริง"> </div>
            
            <div class="form-group"> 
                <label>เป็นผู้รับบริการ รพ.สวี:</label> 
                <div class="input-wrapper radio-group"> 
                    <label><input type="radio" name="isSawiPatient" value="1" checked> ใช่</label> 
                    <label><input type="radio" name="isSawiPatient" value="0"> ไม่ใช่</label> 
                </div> 
            </div>

            <div id="patientForm">
                <div class="form-group">
                    <label for="telephone">เบอร์โทรศัพท์ (บังคับ):</label>
                    <input type="text" id="telephone" maxlength="10" inputmode="numeric" placeholder="ตัวเลข 10 หลัก (ไม่ต้องมีขีด)">
                </div>

                <div class="form-group">
                    <label for="lineId">LINE ID:</label>
                    <input type="text" id="lineId" placeholder="">
                    <small>ไปที่ ⚙️ > โปรไฟล์ > LINE ID > คัดลอก</small>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="allowTel" checked>
                        ยินยอมให้ข้อมูลส่วนบุคคลแก่ อสม./จนท. เพื่อดูแลสุขภาพ
                    </label>
                </div>

                <div class="form-group">
                    <label for="hn">HN เลข รพ. (ถ้าจำได้):</label>
                    <input type="text" id="hn" inputmode="numeric" placeholder="เลข 9 หลัก">
                </div>

                <div class="form-group">
                    <label>หมู่ที่ / ตำบล:</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="village" style="flex: 1;">
                            <option value="">หมู่ที่</option>
                        </select>
                        <select id="district" style="flex: 2;">
                            <option value="">ตำบล</option>
                            <option>ท่าหิน</option>
                            <option>ด่านสวี</option>
                            <option>เขาทะลุ</option>
                            <option>เขาค่าย</option>
                            <option>ปากแพรก</option>
                            <option>สวี</option>
                            <option>นาสัก</option>
                            <option>ทุ่งระยะ</option>
                            <option>วิสัยใต้</option>
                            <option>ครน</option>
                            <option>นาโพธิ์</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pcu">รพ.สต.:</label>
                    <input type="text" id="pcu" readonly>
                </div>

                <div class="form-group checkbox-group">
                    <label>วิธีเดินทางมารพ. (กรณีฉุกเฉิน):</label>
                    <div class="input-wrapper" style="flex-direction: column;">
                        <label><input type="checkbox" name="help" value="อยู่ตัวคนเดียว"> อยู่ตัวคนเดียว</label>
                        <label><input type="checkbox" name="help" value="ญาติ/คนในบ้านมาส่ง"> ญาติ/คนในบ้านมาส่ง</label>
                        <label><input type="checkbox" name="help" value="คนข้างบ้านมาส่ง"> คนข้างบ้านมาส่ง</label>
                        <label><input type="checkbox" name="help" value="ผู้นำชุมชน"> ผู้นำชุมชน</label>
                        <label><input type="checkbox" name="help" value="รถฉุกเฉิน/กู้ชีพ"> รถฉุกเฉิน/กู้ชีพ</label>
                    </div>
                </div>
            </div>
            <hr style="margin: 30px 0;">

            <div class="form-group checkbox-group">
                <label>โรคประจำตัว:</label>
                <div class="input-wrapper" style="flex-direction: column;">
                    <label>
                        <input type="checkbox" name="ud" value="โรคหลอดเลือดสมอง" class="calc-input" id="chk-stroke"> 
                        โรคหลอดเลือดสมอง (สโตรก)
                    </label>
                    <div id="stroke-date-wrapper">
                        <label style="font-size: 20px; color: #d9534f;">ระบุวันที่เป็น (ประมาณ):</label>
                        <input type="date" id="stroke-date">
                    </div>

                    <label><input type="checkbox" name="ud" value="ความดันสูง"> ความดันสูง</label>
                    <label><input type="checkbox" name="ud" value="เบาหวาน"> เบาหวาน</label>
                    <label><input type="checkbox" name="ud" value="ไขมันในเลือดสูง"> ไขมันในเลือดสูง</label>
                    <label><input type="checkbox" name="ud" value="โรคหัวใจ"> โรคหัวใจ</label>
                </div>
            </div>

            <div class="form-group"> <label for="age">อายุ (ปี):</label> <input type="number" id="age" class="calc-input" inputmode="numeric"> </div>
            
            <div class="form-group"> <label>เพศ:</label> <div class="input-wrapper radio-group"> <label><input type="radio" name="sex" value="0" class="calc-input"> หญิง</label> <label><input type="radio" name="sex" value="1" class="calc-input"> ชาย</label> </div> </div>
            
            <div class="form-group"> <label>สูบบุหรี่:</label> <div class="input-wrapper radio-group"> <label><input type="radio" name="smoke" value="0" class="calc-input" checked> ไม่สูบ</label> <label><input type="radio" name="smoke" value="1" class="calc-input"> สูบ</label> </div> </div>
            
            <div class="form-group"> <label>เป็นเบาหวาน:</label> <div class="input-wrapper radio-group"> <label><input type="radio" name="dm" value="0" class="calc-input" checked> ไม่เป็น</label> <label><input type="radio" name="dm" value="1" class="calc-input"> เป็น</label> </div> </div>
            
            <div class="form-group"> <label for="sbp">ความดัน (ตัวบน):</label> <input type="number" id="sbp" class="calc-input" inputmode="numeric" placeholder="ความดันค่าสูงแค่ค่าเดียว"> </div>
            
            <div class="form-group"> 
                <label>มีผลเลือดไขมันคอเลสเตอรอล:</label> 
                <div class="input-wrapper radio-group"> 
                    <label><input type="radio" name="useCholesterol" value="1" class="calc-input"> มี</label> 
                    <label><input type="radio" name="useCholesterol" value="0" class="calc-input" checked> ไม่มี</label> 
                </div> 
            </div>
            
            <div id="tc_group" style="display:none;"> 
                <div class="form-group"> <label for="tc">Total Cholesterol:</label> <input type="number" id="tc" class="calc-input" inputmode="numeric"> </div> 
            </div>
            
            <div id="body_measure_group">
                <div class="form-group"> <label for="wc">รอบเอว (นิ้ว ไม่ใช่ ซม.):</label> <input type="number" id="wc" class="calc-input" inputmode="numeric" placeholder="เช่น 32, 34"> </div>
                <div class="form-group"> <label for="bdh">ส่วนสูง (ซม.):</label> <input type="number" id="bdh" class="calc-input" inputmode="numeric"> </div>
            </div>
        </form>

        <div id="result-container"> <div id="result-text"></div> </div>
        
        <div class="form-group checkbox-group" style="margin-top:20px;">
            <label>
                <input type="checkbox" id="pdpa" checked> อนุญาตให้ รพ.สวี ประมวลผลข้อมูลเพื่อวิเคราะห์ความเสี่ยง
            </label>
        </div>
        
        <input type="hidden" id="area" />

        <button id="saveButton" onclick="runSave(event)">บันทึกและดูผลประเมิน</button>
        <div id="credit">จัดทำโดย "สวีรู้ทันสโตรก" รพ.สวี จ.ชุมพร</div>
    </div>
    
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h2 style="color: green; font-weight: bold;">บันทึกสำเร็จ</h2>
            <p>บันทึกข้อมูลเรียบร้อย และส่งผลการประเมินทาง Line ของคุณแล้ว</p>
            <button id="modal-ok-btn">ตกลง</button>
        </div>
    </div>

    <div id="alertModal" class="modal">
        <div class="modal-content">
            <h2 id="alertModalTitle" style="color: #d9534f; font-weight: bold;"></h2>
            <p id="alertModalText"></p>
            <button id="alertModalOkBtn" style="background-color: #6c757d;">ตกลง</button>
        </div>
    </div>

    <script>
        const LIFF_ID = '2005789397-nebQ8oJy';
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw0eiZGphjI0eIORtVhPu8tjVAvEBV2FZGRRJxw6WmdHpIxVBDQM52nW3PJufhrnd4qgg/exec';
        let userProfile = null;
        let loadingInterval;

        // --- 1. Loading Animation Logic ---
        function startLoadingAnimation() {
            const msgs = ["เซมึนหัว", "ตามัวมาก", "มุมปากตก", "ยกแขนยาก", "ลำบากพูด"];
            let i = 0;
            const sub = document.getElementById('loading-subtext');
            const icon = document.getElementById('loading-icon');
            
            if(sub) sub.textContent = msgs[0];
            
            loadingInterval = setInterval(() => {
                if(sub) sub.style.opacity = 0;
                if(icon) icon.style.opacity = 0;
                
                setTimeout(() => {
                    i = (i + 1) % msgs.length;
                    if(sub) sub.textContent = msgs[i];
                    if(sub) sub.style.opacity = 1;
                    if(icon) icon.style.opacity = 1;
                }, 500);
            }, 2500);
        }

        function stopLoadingAnimation() {
            clearInterval(loadingInterval);
            $('#loading').fadeOut();
        }

        // --- 2. Initialization & Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            startLoadingAnimation(); // Start Loading immediately
            
            initializeLiff();
            setupEventListeners();
            populateVillageDropdown();
            toggleMeasurementFields();
            
            // Set initial state for Sawee Patient (Yellow box default show)
            $('#patientForm').show();
        });

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    userProfile = await liff.getProfile();
                    $('#lineName').val(userProfile.displayName);
                    checkUserRegistration(userProfile.userId); 
                    // Note: stopLoadingAnimation is called inside checkUserRegistration or fallback
                }
            } catch (e) { 
                console.error('LIFF Init Error:', e); 
                stopLoadingAnimation(); // Stop if error
                showAlert('LIFF Error', 'ไม่สามารถเริ่มต้นแอปพลิเคชันได้'); 
            }
        }

        function setupEventListeners() {
            $('.calc-input').on('input change', (event) => {
                if (event.target.name === 'useCholesterol') return;
                // If checking stroke, don't run calc immediately until date logic is settled (optional), keeping as is
                runCalculation();
            });
            
            $('input[name="useCholesterol"]').on('change', toggleMeasurementFields);
            
            // Is Sawi Patient Toggle Logic
            $('input[name="isSawiPatient"]').on('change', () => {
                const isPatient = $('input[name="isSawiPatient"]:checked').val() === '1';
                if(isPatient) {
                    $('#patientForm').slideDown();
                } else {
                    $('#patientForm').slideUp();
                }
            });

            // Stroke Date Toggle Logic
            $('#chk-stroke').on('change', (e) => {
                if (e.target.checked) {
                    $('#stroke-date-wrapper').slideDown();
                } else {
                    $('#stroke-date-wrapper').slideUp();
                    $('#stroke-date').val(''); // Clear date if unchecked
                }
                runCalculation();
            });

            $('#village, #district').on('change', () => {
                const areaStr = `ต.${$('#district').val()} ม.${$('#village').val()}`;
                $('#area').val(areaStr);
                updateAddressAndHospital();
            });
            
            $('#modal-ok-btn').on('click', () => { if (liff.isInClient()) liff.closeWindow(); });
            $('#alertModalOkBtn').on('click', () => $('#alertModal').hide());
            
            $('#info-icon').on('click', () => {
                showAlert('ข้อจำกัดความรับผิดชอบ', 'เครื่องมือนี้ใช้เพื่อประเมินความเสี่ยงเบื้องต้นโดยอาศัยแบบจำลองทางสถิติ (Thai CV Risk Score) เท่านั้น ผลลัพธ์ที่ได้ไม่ใช่การวินิจฉัยทางการแพทย์ หากมีอาการเตือนของโรคหลอดเลือดสมอง (B.E.F.A.S.T.) ให้รีบไปพบแพทย์ทันที');
            });
        }

        // --- 3. Logic Functions ---

        function runCalculation() {
             if (validateCalculationInputs()) {
                 const { riskData, inputs } = calculateRisk();
                 displayResults(riskData, inputs);
             } else {
                 $('#result-container').hide();
             }
        }
        
        function formatThaiDateTime(isoString) {
            if (!isoString) return '';
            try {
                const date = new Date(isoString);
                if (isNaN(date)) return isoString;
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear() + 543;
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${day}/${month}/${year} เวลา ${hours}:${minutes} น.`;
            } catch (e) { return isoString; }
        }

        function dateToThaiStr(dateVal) {
             if(!dateVal) return "";
             const d = new Date(dateVal);
             const day = String(d.getDate()).padStart(2,'0');
             const month = String(d.getMonth() + 1).padStart(2,'0');
             const year = d.getFullYear() + 543;
             return `${day}/${month}/${year}`;
        }
        
        // JSONP Callback
        window.handleUserRegistration = function(response) {
            stopLoadingAnimation(); // Stop loading when data returns
            
            if (response.status === 'found' && response.data) {
                const record = response.data;
                const ts = formatThaiDateTime(record.timestamp);
                $('#registration-status').text(`✔️ คุณเคยลงทะเบียนแล้วเมื่อ ${ts}`).show();
                if (record.name)      $('#name').val(record.name);
                if (record.telephone) $('#telephone').val(record.telephone);
                if (record.hn)        $('#hn').val(record.hn);
                if (record.district)  $('#district').val(record.district);
                if (record.village) {
                    $('#village').val(record.village);
                    $('#district').trigger('change');
                }
                if (record.line_id)   $('#lineId').val(record.line_id);
                if (record.help) {
                    record.help.split(', ').forEach(val => {
                        $(`input[name="help"][value="${val}"]`).prop('checked', true);
                    });
                }
            }
        };

        function checkUserRegistration(userId) {
            // Set fallback timeout in case JSONP fails
            setTimeout(() => stopLoadingAnimation(), 8000); 

            const url = `${GAS_URL}?userId=${encodeURIComponent(userId)}&callback=handleUserRegistration`;
            const s = document.createElement('script');
            s.src = url;
            s.onerror = () => stopLoadingAnimation(); // Stop if script fails
            document.head.appendChild(s);
        }

        function showAlert(title, message) { $('#alertModalTitle').text(title); $('#alertModalText').text(message); $('#alertModal').show(); }

        function validateCalculationInputs() { 
            const requiredInputs = { 'อายุ': $('#age').val(), 'เพศ': $('input[name="sex"]:checked').val(), 'สูบบุหรี่': $('input[name="smoke"]:checked').val(), 'เบาหวาน': $('input[name="dm"]:checked').val(), 'ความดัน': $('#sbp').val() }; 
            if ($('input[name="useCholesterol"]:checked').val() === '1') { requiredInputs['Cholesterol'] = $('#tc').val(); } 
            else { requiredInputs['รอบเอว'] = $('#wc').val(); requiredInputs['ส่วนสูง'] = $('#bdh').val(); } 
            return Object.values(requiredInputs).every(val => val && String(val).trim() !== ''); 
        }

        function TASCVDformular(age, smoke, dm, sbp, sex, tc, whr, wc) { var full_score = 0, compare_score = 0, predicted_risk = 0, compare_risk = 0; var compare_whr = sex == 0 ? 0.52667 : 0.58125; var compare_wc = sex == 0 ? 79 : 93; var compare_sbp = 120; if (sex == 1 && age > 60) { compare_sbp = 132; } if (sex == 0 && age <= 60) { compare_sbp = 115; } if (sex == 0 && age > 60) { compare_sbp = 130; } var sur_root = 0.964588; if (tc > 0) { full_score = (0.08183 * age) + (0.39499 * sex) + (0.02084 * sbp) + (0.69974 * dm) + (0.00212 * tc) + (0.41916 * smoke); predicted_risk = 1 - (Math.pow(sur_root, Math.exp(full_score - 7.04423))); compare_score = (0.08183 * age) + (0.39499 * sex) + (0.02084 * compare_sbp) + (0.00212 * 200); compare_risk = 1 - (Math.pow(sur_root, Math.exp(compare_score - 7.04423))); } else if (whr > 0) { full_score = (0.079 * age) + (0.128 * sex) + (0.019350987 * sbp) + (0.58454 * dm) + (3.512566 * whr) + (0.459 * smoke); predicted_risk = 1 - (Math.pow(sur_root, Math.exp(full_score - 7.712325))); compare_score = (0.079 * age) + (0.128 * sex) + (0.019350987 * compare_sbp) + (3.512566 * compare_whr); compare_risk = 1 - (Math.pow(sur_root, Math.exp(compare_score - 7.712325))); } else if (wc > 0) { full_score = (0.08372 * age) + (0.05988 * sex) + (0.02034 * sbp) + (0.59953 * dm) + (0.01283 * wc) + (0.459 * smoke); predicted_risk = 1 - (Math.pow(sur_root, Math.exp(full_score - 7.31047))); compare_score = (0.08372 * age) + (0.05988 * sex) + (0.02034 * compare_sbp) + (0.01283 * compare_wc); compare_risk = 1 - (Math.pow(sur_root, Math.exp(compare_score - 7.31047))); } return [full_score, predicted_risk, compare_score, compare_risk]; }
        
        function calculateRisk() {
          const rawInputs = {
            age:        parseFloat($('#age').val())    || 0,
            sex:        +$('input[name="sex"]:checked').val(),
            smoke:      +$('input[name="smoke"]:checked').val(),
            dm:         +$('input[name="dm"]:checked').val(),
            sbp:        parseFloat($('#sbp').val())    || 0,
            tc:         $('input[name="useCholesterol"]:checked').val() === '1' ? parseFloat($('#tc').val()) || 0 : 0,
            wc_inch:    $('input[name="useCholesterol"]:checked').val() === '0' ? parseFloat($('#wc').val()) || 0 : 0,
            ht:         $('input[name="useCholesterol"]:checked').val() === '0' ? parseFloat($('#bdh').val())|| 0 : 0,
            hasStrokeHistory: $('#chk-stroke').is(':checked')
          };

          if (rawInputs.hasStrokeHistory) {
            return {
              riskData: {
                riskPercentText: '>40%',
                barValue: 30,
                riskGroup: 'สูงอันตราย (มีประวัติสโตรก)',
                riskColor: '#8B0000',
                compareRatio: 'N/A'
              },
              inputs: rawInputs
            };
          }

          const wc_cm = rawInputs.wc_inch * 2.54;
          const whr   = wc_cm > 0 && rawInputs.ht > 0 ? wc_cm / rawInputs.ht : 0;
          const clamped = {
            age:  Math.max(30, Math.min(rawInputs.age, 70)),
            sbp:  Math.max(70, Math.min(rawInputs.sbp, 220)),
            tc:   rawInputs.tc > 0 ? Math.min(rawInputs.tc, 280) : 0,
            whr:  whr,
            wc_cm: wc_cm
          };
          const [ , predicted_risk, , compare_risk ] = TASCVDformular(clamped.age, rawInputs.smoke, rawInputs.dm, clamped.sbp, rawInputs.sex, clamped.tc, clamped.whr, clamped.wc_cm);

          let percentNum = predicted_risk * 100;
          let barValue   = percentNum;
          let percentTxt = `${Math.round(percentNum)}%`;
          if (percentNum > 30) { barValue = 30; percentTxt = '>30%'; }

          const classification = classifyRisk(predicted_risk);
          const riskData = {
            riskPercentText: percentTxt,
            barValue:        barValue,
            riskGroup:       classification.text,
            riskColor:       classification.color,
            compareRatio:    compare_risk > 0 ? compare_risk.toFixed(1) : 'N/A'
          };

          return { riskData: riskData, inputs: rawInputs };
        }

        function classifyRisk(risk) {
            if (risk < 0.10) return { text: "ต่ำ", color: "#28a745" };
            if (risk < 0.20) return { text: "ปานกลาง", color: "#ffc107" };
            if (risk < 0.30) return { text: "สูง", color: "#fd7e14" };
            if (risk < 0.40) return { text: "สูงมาก", color: "#dc3545" };
            return { text: "สูงอันตราย", color: "#8B0000" };
        }
        
        function generateSuggestionText(inputs) { 
            let suggestions = []; 
            if (inputs.age < 40) { suggestions.push('ปัจจุบันพบโรคหลอดเลือดสมองในคนอายุน้อย (Stroke in the Young) มากขึ้น ควรใส่ใจดูแลสุขภาพแต่เนิ่นๆ'); } 
            if (inputs.smoke === 1) suggestions.push('เลิกสูบบุหรี่'); 
            if (inputs.dm === 1) suggestions.push('รักษาระดับน้ำตาลในเลือดให้อยู่ในเกณฑ์ปกติ'); 
            if (inputs.sbp >= 140) suggestions.push('ควบคุมระดับความดันโลหิต (เป้าหมาย < 140/90 mmHg)'); 
            if (inputs.tc > 0 && inputs.tc >= 220) suggestions.push('ควบคุมระดับไขมันในเลือด'); 
            const wc_cm = inputs.wc_inch * 2.54; 
            if (inputs.tc <= 0 && ((inputs.sex === 1 && wc_cm >= 90) || (inputs.sex === 0 && wc_cm >= 80))) { suggestions.push('ลดน้ำหนัก/รอบเอว (เป้าหมาย: ชาย < 90 ซม., หญิง < 80 ซม.)'); } 
            if (suggestions.length === 0) { suggestions.push("คุณไม่มีปัจจัยเสี่ยงที่ผิดปกติ แต่ควรรักษาวิถีชีวิตที่ส่งเสริมสุขภาพดีต่อไป"); } 
            const finalAdvice = 'เรียนรู้สัญญาณเตือนสโตรก <strong style="color: #198754;">B.E.F.A.S.T.</strong> (หน้าเบี้ยว, แขนขาอ่อนแรง, พูดไม่ชัด) เพื่อรีบไปโรงพยาบาลให้ทันเวลา';
            return { suggestions, finalAdvice }; 
        }
        
        function displayResults(riskData, inputs) { 
            const { suggestions, finalAdvice } = generateSuggestionText(inputs); 
            let compareText = `ซึ่งเมื่อเทียบกับคนเพศ/อายุเดียวกันที่ไม่มีปัจจัยเสี่ยง ความเสี่ยงของคุณจะอยู่ที่ ${riskData.compareRatio} เท่า`; 
            if (riskData.compareRatio === "N/A" || isNaN(parseFloat(riskData.compareRatio))) { compareText = ""; }

            let suggestionsHtml = '<ul>';
            suggestions.forEach(item => { suggestionsHtml += `<li>${item}</li>`; });
            suggestionsHtml += `<li>${finalAdvice}</li></ul>`;

            const resultHtml = `
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: ${riskData.barValue}%; background-color: ${riskData.riskColor};">${riskData.riskPercentText}</div>
                </div>
                <p style="font-size: 1.3rem; font-weight: 500;">ความเสี่ยง 10 ปี: <strong>${riskData.riskPercentText} (${riskData.riskGroup})</strong></p>
                <p style="font-size: 1.1rem;">${compareText}</p>
                <hr>
                <p style="text-align:left; font-weight:bold;">ข้อแนะนำเบื้องต้น</p>
                <div style="font-size: 1.1rem;">${suggestionsHtml}</div>
            `; 
            $('#result-text').html(resultHtml).parent().show(); 
        }
        
        async function runSave(event) {
            if (!userProfile) { showAlert('เกิดข้อผิดพลาด', 'ยังไม่สามารถดึงข้อมูลผู้ใช้ LINE ได้'); return; }
            if (!validateCalculationInputs()) { showAlert('ข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลการประเมินความเสี่ยงให้ครบถ้วน'); return; }

            // Validate Phone Number for Sawee Patient
            const isSawiPatient = $('input[name="isSawiPatient"]:checked').val() === '1';
            const phone = $('#telephone').val().trim();
            if (isSawiPatient) {
                if (!/^\d{10}$/.test(phone)) {
                    showAlert('ข้อมูลไม่ถูกต้อง', 'กรุณากรอกเบอร์โทรศัพท์ 10 หลัก (ตัวเลขเท่านั้น ไม่ต้องมีขีด)');
                    $('#telephone').focus();
                    return;
                }
            }

            const saveButton = $(event.target);
            saveButton.prop('disabled', true).text('กำลังบันทึก...');

            const { riskData, inputs } = calculateRisk();
            const { suggestions, finalAdvice } = generateSuggestionText(inputs);
            const suggestionText = suggestions.join('\n') + '\n' + finalAdvice.replace(/<[^>]*>?/gm, '');

            // Construct UD String with Date Logic
            let udList = $('input[name="ud"]:checked').map((_, el) => {
                let val = $(el).val();
                if (val === 'โรคหลอดเลือดสมอง') {
                    // Check date input
                    let dateVal = $('#stroke-date').val();
                    let dateStr = dateVal ? ` (${dateToThaiStr(dateVal)})` : ' (ไม่ระบุวันที่)';
                    return `สโตรก${dateStr}`;
                }
                return val;
            }).get().join(', ');

            const dataToSend = {
                name: $('#name').val().trim() || userProfile.displayName,
                role: $('#role').val(),
                isSawiPatient: isSawiPatient ? '1' : '0',

                telephone: phone,
                line_id: $('#lineId').val().trim(),

                allow_tel: $('#allowTel').is(':checked') ? $('#allowTel').parent().text().trim() : '',
                pdpa: $('#pdpa').is(':checked') ? $('#pdpa').parent().text().trim() : '',

                hn: $('#hn').val().trim(),
                district: $('#district').val(),
                village: $('#village').val(),
                pcu: $('#pcu').val(),
                ud: udList,
                help: $('input[name="help"]:checked').map((_,el)=>$(el).val()).get().join(', '),

                age: inputs.age,
                gender: inputs.sex,
                smoke: inputs.smoke,
                dm: inputs.dm,
                sbp: inputs.sbp,
                cholesterol: inputs.tc,
                waist: inputs.wc_inch,
                height: inputs.ht,

                area: `ต.${$('#district').val()} ม.${$('#village').val()}`,

                thai_cv_risk_score: riskData.riskPercentText.replace(/[^0-9.]/g, ''),
                risk_group: riskData.riskGroup,
                compare_risk: riskData.compareRatio,
                suggestion: suggestionText,

                userId: userProfile.userId,
                displayName: userProfile.displayName,
                pictureUrl: userProfile.pictureUrl
            };

            console.log('payload:', dataToSend);

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(dataToSend),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                if (result.status === 'success') {
                    $('#successModal').show();
                } else {
                    throw new Error(result.message || 'Server returned an error.');
                }
            } catch (error) {
                showAlert('การบันทึกล้มเหลว', `เกิดข้อผิดพลาด: ${error.message}`);
            } finally {
                saveButton.prop('disabled', false).text('บันทึกและดูผลประเมิน');
            }
        }
    </script>
