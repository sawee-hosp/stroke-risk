<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวีรู้ทันสโตรก</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* --- Base Styles --- */
        body { 
            font-family: "Noto Sans Thai", sans-serif; 
            font-size: 18px; 
            background: #fff; margin: 0; color: #333;
            line-height: 1.5;
        }
        .container { 
            max-width: 100%; min-height: 100vh; 
            padding: 15px; margin: 0 auto;
        }

        /* --- UI Elements --- */
        .header-group { text-align: center; margin-bottom: 20px; position: relative; }
        h1 { color: #003366; font-weight: 800; display: inline-block; font-size: 26px; margin: 0; }
        
        #btn-disclaimer {
            font-size: 14px; padding: 2px 8px; border-radius: 10px;
            background: #17a2b8; color: white; border: none;
            vertical-align: middle; margin-left: 10px; cursor: pointer;
        }

        .form-row { 
            margin-bottom: 20px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px;
        }
        .form-row:last-child { border-bottom: none; }
        
        label { font-weight: 700; display: block; margin-bottom: 8px; color: #003366; }
        small { font-weight: 400; font-size: 16px; color: #666; display: block; margin-top: 5px; }

        input[type="number"], input[type="text"], input[type="date"], select { 
            width: 100%; padding: 10px; font-size: 18px; 
            border-radius: 8px; border: 1px solid #ccc; 
            background: #f9f9f9;
        }
        input:read-only { background-color: #e9ecef; cursor: not-allowed; }
        input:focus, select:focus { border-color: #007BFF; outline: none; background: #fff; }

        /* Radio/Checkbox */
        .inline-group { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .radio-label { font-weight: normal; display: flex; align-items: center; cursor: pointer; }
        input[type="radio"], input[type="checkbox"] { transform: scale(1.5); margin-right: 10px; }

        .sawi-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .sawi-label { margin-bottom: 0; margin-right: 15px; }

        #patientForm { 
            background-color: #FFFDE7; border: 2px solid #FFC107; 
            padding: 15px; border-radius: 12px; margin-top: 10px;
        }

        #disclaimer-box {
            display: none; background: #f8f9fa; padding: 15px;
            border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px;
            font-size: 16px; color: #555;
        }

        /* Result Section */
        #result-container { 
            margin-top: 20px; padding: 20px; 
            background: #E8F8F5; border-radius: 15px;
            border: 2px solid #28a745; display: none; text-align: center;
        }
        .risk-percent { font-size: 3.5rem; font-weight: 900; line-height: 1; margin: 10px 0; color: #28a745; }
        .risk-desc { font-size: 1.2rem; font-weight: bold; color: #333; margin-bottom: 15px; }
        .progress-bar-bg { width: 100%; height: 20px; background: #ddd; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-bar-fill { height: 100%; background: #28a745; width: 0%; transition: width 0.5s ease; }
        .explanation-box { text-align: left; background: #fff; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 18px; border: 1px solid #ccc; }

        button#saveButton { 
            width: 100%; padding: 15px; font-size: 20px; font-weight: bold;
            color: white; background-color: #007BFF; border: none; border-radius: 50px; 
            margin-top: 20px; box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        button:active { transform: scale(0.98); }

        .hidden { display: none; }
        #loading { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.8); display: flex; 
            justify-content: center; align-items: center; z-index: 9999; 
        }
        .spinner-border { width: 3rem; height: 3rem; color: #007BFF; }
        .status-box { padding: 8px; border-radius: 8px; text-align: center; font-size: 16px; margin-bottom: 10px; font-weight: bold;}
        .found { background: #d1e7dd; color: #0f5132; }
        .warn { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <div id="loading"><div class="spinner-border"></div></div>

    <div class="container">
        <div class="header-group">
            <h1>ประเมินความเสี่ยงสโตรก</h1>
            <button id="btn-disclaimer" type="button">อ่านก่อน</button>
        </div>

        <div id="disclaimer-box">
            <b>ข้อจำกัดความรับผิดชอบ:</b><br>
            แบบประเมินนี้ใช้เพื่อคัดกรองความเสี่ยงเบื้องต้นด้วยโมเดลทางสถิติ (Thai CV Risk Score) เท่านั้น ไม่สามารถใช้แทนการวินิจฉัยทางการแพทย์ได้
        </div>
        
        <div id="history-alert"></div>

        <form id="mainForm">
            <input type="hidden" id="lineName">
            <input type="hidden" id="area">

            <div class="form-row">
                <label>ประเมินให้ใคร:</label>
                <select id="role">
                    <option value="ประเมินตัวเอง" selected>ประเมินตัวเอง</option>
                    <option value="ญาติ/ผู้ดูแลผู้ป่วย">ญาติ/ผู้ดูแลผู้ป่วย</option>
                    <option value="จนท.สาธารณสุข">จนท.สาธารณสุข</option>
                    <option value="อสม.สโตรก ประเมินให้คนอื่น">อสม.สโตรก ประเมินให้คนอื่น</option>
                </select>
            </div>

            <div class="form-row">
                <label>ชื่อผู้รับการประเมิน:</label>
                <input type="text" id="name" placeholder="ชื่อเล่น หรือ ชื่อจริง">
            </div>

            <div class="form-row sawi-row">
                <label class="sawi-label">เป็นผู้รับบริการ รพ.สวี:</label>
                <div class="inline-group">
                    <label class="radio-label"><input type="radio" name="isSawiPatient" value="1" checked> ใช่</label>
                    <label class="radio-label"><input type="radio" name="isSawiPatient" value="0"> ไม่ใช่</label>
                </div>
            </div>

            <div id="patientForm">
                <div class="form-row" style="border:none;">
                    <label>เบอร์โทรศัพท์ (บังคับ):</label>
                    <input type="text" id="telephone" maxlength="10" inputmode="numeric" placeholder="เบอร์มือถือ 10 หลัก">
                </div>
                <div class="form-row" style="border:none;">
                    <label>LINE ID:</label>
                    <input type="text" id="lineId" placeholder="ถ้าจำได้">
                </div>
                <div class="form-row" style="border:none;">
                    <label>HN (เลขบัตร รพ. ถ้าทราบ):</label>
                    <input type="text" id="hn" placeholder="ระบุเลข HN">
                </div>
                
                <div class="form-row" style="border:none;">
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>หมู่ที่:</label>
                            <select id="village"><option value="">เลือก</option></select>
                        </div>
                        <div style="flex: 1.5;">
                            <label>ตำบล:</label>
                            <select id="district"><option value="">เลือก</option>
                                <option>ท่าหิน</option><option>ด่านสวี</option><option>เขาทะลุ</option>
                                <option>เขาค่าย</option><option>ปากแพรก</option><option>สวี</option>
                                <option>นาสัก</option><option>ทุ่งระยะ</option><option>วิสัยใต้</option>
                                <option>ครน</option><option>นาโพธิ์</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row" style="border:none;">
                    <label>รพ.สต. ที่รับผิดชอบ:</label>
                    <input type="text" id="pcu" readonly placeholder="จะแสดงอัตโนมัติเมื่อเลือกที่อยู่">
                </div>

                <div class="form-row" style="border:none;">
                    <label class="radio-label" style="align-items: flex-start;">
                        <input type="checkbox" id="allowTel" checked style="margin-top: 5px;"> 
                        <span>ยินยอมให้ข้อมูลเบอร์โทร/ที่อยู่ แก่ อสม.และ จนท.รพ.สวี</span>
                    </label>
                </div>

                <div class="form-row" style="border:none; border-top: 1px dashed #ccc; padding-top: 15px;">
                    <label>สมมติจู่ๆ ปากเบี้ยว แขนไม่มีแรง คุณจะทำอย่างไรเป็นอย่างแรก?</label>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <label class="radio-label"><input type="radio" name="decision" value="รอดูอาการ"> รอดูอาการ</label>
                        <label class="radio-label"><input type="radio" name="decision" value="โทรให้ญาติมาดู"> โทรให้ญาติมาดู</label>
                        <label class="radio-label"><input type="radio" name="decision" value="ไปคลินิก-อนามัย"> ไปคลินิก-อนามัย</label>
                        <label class="radio-label"><input type="radio" name="decision" value="รีบไป รพ.เอง"> รีบไป รพ.เอง</label>
                        <label class="radio-label"><input type="radio" name="decision" value="โทร 1669 ให้รถมารับ"> โทร 1669 ให้รถมารับ</label>
                    </div>
                </div>

                <div class="form-row" style="border:none;">
                    <label>ปกติช่วงกลางวัน/กลางคืน คุณอยู่บ้านกับใคร?</label>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <label class="radio-label"><input type="radio" name="help" value="อยู่คนเดียว"> อยู่คนเดียว</label>
                        <label class="radio-label"><input type="radio" name="help" value="อยู่กับผู้สูงอายุ/เด็กเล็ก"> อยู่กับผู้สูงอายุ/เด็กเล็ก</label>
                        <label class="radio-label"><input type="radio" name="help" value="อยู่กับญาติผู้ใหญ่/คนวัยทำงาน"> อยู่กับญาติผู้ใหญ่/คนวัยทำงาน</label>
                    </div>
                </div>
            </div>

            <h3 style="margin-top:30px; border-bottom: 2px solid #003366;">ข้อมูลสุขภาพ</h3>
            
            <div class="form-row">
                <label>โรคประจำตัว:</label>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <label class="radio-label"><input type="checkbox" class="calc-trigger" name="ud" value="โรคหลอดเลือดสมอง" id="chk-stroke"> เคยเป็นสโตรก</label>
                    <div id="stroke-date-wrapper" class="hidden" style="margin-left:30px;">
                        <label>วันที่เป็น:</label><input type="date" id="stroke-date">
                    </div>
                    <label class="radio-label"><input type="checkbox" class="calc-trigger" name="ud" value="ความดันสูง"> ความดันสูง</label>
                    <label class="radio-label"><input type="checkbox" class="calc-trigger" name="ud" value="เบาหวาน"> เบาหวาน</label>
                    <label class="radio-label"><input type="checkbox" class="calc-trigger" name="ud" value="ไขมันในเลือดสูง"> ไขมันในเลือดสูง</label>
                </div>
            </div>

            <div class="form-row">
                <label>อายุ (ปี):</label>
                <input type="number" id="age" class="calc-trigger" inputmode="numeric">
            </div>

            <div class="form-row">
                <label>เพศ:</label>
                <div class="inline-group">
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="sex" value="0"> หญิง</label>
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="sex" value="1"> ชาย</label>
                </div>
            </div>

            <div class="form-row">
                <label>สูบบุหรี่:</label>
                <div class="inline-group">
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="smoke" value="0" checked> ไม่สูบ</label>
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="smoke" value="1"> สูบ</label>
                </div>
            </div>

            <div class="form-row">
                <label>เป็นเบาหวาน:</label>
                <div class="inline-group">
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="dm" value="0" checked> ไม่เป็น</label>
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="dm" value="1"> เป็น</label>
                </div>
            </div>

            <div class="form-row">
                <label>ความดัน (ค่าสูงตัวเดียว):</label>
                <input type="number" id="sbp" class="calc-trigger" inputmode="numeric" placeholder="ตัวเลขเท่านั้น เช่น 135">
            </div>

            <div class="form-row">
                <label>มีผลเลือดไขมัน (คอเลสเตอรอล):</label>
                <small>(ดูจากสมุดไขมันหรือหมอพร้อม)</small>
                <div class="inline-group" style="margin-top:5px;">
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="useCholesterol" value="1"> มี</label>
                    <label class="radio-label"><input type="radio" class="calc-trigger" name="useCholesterol" value="0" checked> ไม่มี</label>
                </div>
            </div>

            <div id="tc_group" class="form-row hidden">
                <label>ค่าคอเลสเตอรอลรวม:</label>
                <input type="number" id="tc" class="calc-trigger" inputmode="numeric">
            </div>

            <div id="body_measure_group">
                <div class="form-row">
                    <label>รอบเอว (นิ้ว):</label>
                    <input type="number" id="wc" class="calc-trigger" inputmode="numeric" placeholder="เช่น 30, 32">
                </div>
                <div class="form-row">
                    <label>ส่วนสูง (ซม.):</label>
                    <input type="number" id="bdh" class="calc-trigger" inputmode="numeric">
                </div>
            </div>

        </form>

        <div id="result-container">
            <h3>ผลการประเมินเบื้องต้น</h3>
            <div class="risk-percent" id="rt-percent">0%</div>
            <div class="risk-desc" id="rt-desc">-</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="rt-bar"></div>
            </div>
            <div class="explanation-box" id="rt-explanation"></div>
        </div>

        <button id="saveButton" onclick="saveAndSend()">บันทึกและดูผลประเมิน</button>
        <div style="text-align:center; margin-top:30px; color:#888;">จัดทำโดย "สวีรู้ทันสโตรก" รพ.สวี จ.ชุมพร</div>
    </div>

    <script>
        // ใส่ URL ที่ได้จากการ Deploy ใหม่ที่นี่
        const LIFF_ID = '2005789397-nebQ8oJy';
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw0eiZGphjI0eIORtVhPu8tjVAvEBV2FZGRRJxw6WmdHpIxVBDQM52nW3PJufhrnd4qgg/exec'; 
        
        let userProfile = null;
        let globalRiskData = null;

        $(document).ready(() => {
            $('#loading').fadeOut(300);
            initializeLiff();
            populateVillageDropdown();
            toggleMeasurementFields();
            
            // Listeners
            $('#btn-disclaimer').click(function() { $('#disclaimer-box').slideToggle(); });
            $('input[name="isSawiPatient"]').change(function() {
                $(this).val() === '1' ? $('#patientForm').slideDown() : $('#patientForm').slideUp();
            });
            $('#sbp').on('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
            $('input[name="useCholesterol"]').change(toggleMeasurementFields);
            $('#chk-stroke').change(function() {
                this.checked ? $('#stroke-date-wrapper').slideDown() : $('#stroke-date-wrapper').slideUp();
                updateRealtimeResult();
            });
            $('.calc-trigger').on('input change', updateRealtimeResult);
            $('#village, #district').change(updateAddressAndHospital);
            $('#role').change(() => {
               const history = $('#history-alert').data('record');
               if(history) displayHistoryAlert(history);
            });
        });

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    userProfile = await liff.getProfile();
                    checkUserRegistration(userProfile.userId);
                } else { liff.login(); }
            } catch (e) { console.error(e); }
        }

        function populateVillageDropdown() { for (let i=1; i<=19; i++) $('#village').append(`<option value="${i}">${i}</option>`); }

        function updateAddressAndHospital() {
            const moo = $('#village').val(); 
            const tb = $('#district').val();
            const hospitals = { "ท่าหิน": "รพ.สต.ท่าหิน", "ด่านสวี": "รพ.สต.ด่านสวี", "เขาทะลุ": "รพ.สต.เขาทะลุ", "เขาค่าย": "รพ.สต.เขาค่าย", "ปากแพรก": "รพ.สต.ปากแพรก", "สวี": "รพ.สต.สวี", "นาสัก": { "1": "รพ.สต.บ้านแก่งกระทั่ง", "6": "รพ.สต.บ้านแก่งกระทั่ง", "11": "รพ.สต.บ้านแก่งกระทั่ง", "13": "รพ.สต.บ้านแก่งกระทั่ง", "18": "รพ.สต.บ้านแก่งกระทั่ง", "19": "รพ.สต.บ้านแก่งกระทั่ง", "7": "รพ.สต.บ้านไทยพัฒนา", "8": "รพ.สต.บ้านไทยพัฒนา", "9": "รพ.สต.บ้านไทยพัฒนา", "10": "รพ.สต.บ้านไทยพัฒนา", "12": "รพ.สต.บ้านไทยพัฒนา", "15": "รพ.สต.บ้านไทยพัฒนา", "16": "รพ.สต.บ้านไทยพัฒนา", "2": "รพ.สต.นาสัก", "3": "รพ.สต.นาสัก", "4": "รพ.สต.นาสัก", "5": "รพ.สต.นาสัก", "14": "รพ.สต.นาสัก", "17": "รพ.สต.นาสัก" }, "ทุ่งระยะ": { "5": "รพ.สต.บ้านคลองน้อย", "6": "รพ.สต.บ้านคลองน้อย", "7": "รพ.สต.บ้านคลองน้อย", "8": "รพ.สต.บ้านคลองน้อย", "9": "รพ.สต.บ้านคลองน้อย", "10": "รพ.สต.บ้านคลองน้อย", "1": "รพ.สต.ทุ่งระยะ", "2": "รพ.สต.ทุ่งระยะ", "3": "รพ.สต.ทุ่งระยะ", "4": "รพ.สต.ทุ่งระยะ", "11": "รพ.สต.ทุ่งระยะ" }, "วิสัยใต้": { "1": "รพ.สต.บ้านดอนทราย", "3": "รพ.สต.บ้านดอนทราย", "4": "รพ.สต.บ้านดอนทราย", "8": "รพ.สต.บ้านดอนทราย", "2": "รพ.สต.วิสัยใต้", "5": "รพ.สต.วิสัยใต้", "6": "รพ.สต.วิสัยใต้", "7": "รพ.สต.วิสัยใต้", "9": "รพ.สต.วิสัยใต้", "10": "รพ.สต.วิสัยใต้" }, "ครน": { "1": "รพ.สต.ครน", "2": "รพ.สต.ครน", "3": "รพ.สต.ครน", "4": "รพ.สต.ครน", "6": "รพ.สต.ครน", "12": "รพ.สต.ครน", "9": "รพ.สต.บ้านควนสามัคคี", "10": "รพ.สต.บ้านควนสามัคคี", "13": "รพ.สต.บ้านควนสามัคคี", "14": "รพ.สต.บ้านควนสามัคคี", "5": "รพ.สต.บ้านน้ำฉา", "7": "รพ.สต.บ้านน้ำฉา", "8": "รพ.สต.บ้านน้ำฉา", "11": "รพ.สต.บ้านน้ำฉา" }, "นาโพธิ์": "รพ.สวี (นาโพธิ์)" };
            
            let hosp = hospitals[tb]; 
            if (typeof hosp === 'object') { hosp = hosp[moo] || ''; } 
            
            // แสดงผลใน input อัตโนมัติ
            $('#pcu').val(hosp || '');
            
            if(moo && tb) {
                $('#area').val(`ม.${moo} ต.${tb}`);
            } else {
                $('#area').val('');
            }
        }

        async function saveAndSend() {
            if(!globalRiskData) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
            if($('input[name="isSawiPatient"]:checked').val() === '1') {
                if(!$('#telephone').val() || $('#telephone').val().length !== 10) { alert('กรุณากรอกเบอร์มือถือ'); return; }
                if(!$('#village').val() || !$('#district').val()) { alert('กรุณาระบุที่อยู่'); return; }
                if(!$('input[name="decision"]:checked').val()) { alert('กรุณาเลือกสิ่งที่จะทำเมื่อเกิดอาการ (คำถามข้อใหม่)'); return; }
                if(!$('input[name="help"]:checked').val()) { alert('กรุณาระบุคนในบ้าน (คำถามข้อใหม่)'); return; }
            }

            const btn = $('#saveButton');
            btn.prop('disabled', true).text('กำลังส่งข้อมูล...');

            try {
                const ins = globalRiskData.inputs;
                const sug = [];
                if(ins.smoke) sug.push('เลิกบุหรี่');
                if(ins.dm) sug.push('คุมระดับน้ำตาล');
                if(ins.sbp>=140) sug.push('คุมความดันโลหิต');
                const finalAdv = 'สังเกตอาการ B.E.F.A.S.T รีบไป รพ.';
                const suggestionText = sug.join(', ') + '\n' + finalAdv;

                const payload = {
                    // Header set 1
                    timestamp: new Date(),
                    name: $('#name').val(),
                    role: $('#role').val(),
                    hn: $('#hn').val(),
                    district: $('#district').val(),
                    village: $('#village').val(),
                    pcu: $('#pcu').val(),
                    "u/d": $('input[name="ud"]:checked').map(function(){return this.value}).get().join(','), // ตรงกับ u/d
                    help: $('input[name="help"]:checked').val(), // Radio: เลือกได้ค่าเดียว
                    decision: $('input[name="decision"]:checked').val(), // Radio: เลือกได้ค่าเดียว
                    telephone: $('#telephone').val(),
                    line_id: $('#lineId').val(),
                    gender: ins.sex == 1 ? 'ชาย' : 'หญิง', // แปลงเป็น Text หรือส่งเลขแล้วแต่ตกลง (Code เดิมส่ง 0/1) แต่นี่ส่ง Text ชัดเจน
                    age: ins.age,
                    smoke: ins.smoke,
                    dm: ins.dm,
                    sbp: ins.sbp,
                    cholesterol: ins.tc,
                    waist: ins.wc_inch,
                    height: ins.ht,
                    thai_cv_risk_score: globalRiskData.riskPercentText,
                    risk_group: globalRiskData.riskGroup,
                    compare_risk: globalRiskData.compareRatio,
                    suggestion: suggestionText,
                    // Line Info
                    userId: userProfile ? userProfile.userId : '',
                    displayName: userProfile ? userProfile.displayName : '',
                    pictureUrl: userProfile ? userProfile.pictureUrl : '',
                    allow_tel: $('#allowTel').is(':checked')?'Yes':'No',
                    pdpa: 'Yes',
                    area: $('#area').val()
                };

                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                if (liff.isInClient()) {
                    await sendFlex(globalRiskData, payload.name, suggestionText);
                    liff.closeWindow();
                } else {
                    alert('บันทึกสำเร็จ (ปิดหน้าต่างได้เลย)');
                    btn.text('บันทึกเรียบร้อย');
                }

            } catch(e) {
                alert('เกิดข้อผิดพลาด: ' + e.message);
                btn.prop('disabled', false).text('บันทึกและดูผลประเมิน');
            }
        }

        // --- ส่วนคำนวณและอื่นๆ ยังคงเดิม (ย่อไว้) ---
        function toggleMeasurementFields() {
            const useChol = $('input[name="useCholesterol"]:checked').val() === '1';
            $('#tc_group').toggle(useChol);
            $('#body_measure_group').toggle(!useChol);
            updateRealtimeResult();
        }

        function updateRealtimeResult() {
            if(!$('#age').val() || !$('#sbp').val()) { $('#result-container').slideUp(); return; }
            const result = calculateRisk();
            globalRiskData = result;
            $('#rt-percent').text(result.riskPercentText + "%").css('color', result.riskColor);
            $('#rt-desc').text(result.riskGroup).css('color', result.riskColor);
            $('#rt-bar').css('width', (result.barValue / 30 * 100) + "%").css('background', result.riskColor);
            $('#rt-explanation').html(`ภายใน 10 ปี ท่านมีโอกาสเป็นโรคหลอดเลือดสมอง <b>${result.riskPercentText}%</b>`);
            $('#result-container').slideDown();
        }

        function calculateRisk() {
            const inputs = {
                age: parseFloat($('#age').val()) || 0,
                sex: +$('input[name="sex"]:checked').val(),
                smoke: +$('input[name="smoke"]:checked').val(),
                dm: +$('input[name="dm"]:checked').val(),
                sbp: parseFloat($('#sbp').val()) || 0,
                tc: $('input[name="useCholesterol"]:checked').val() === '1' ? parseFloat($('#tc').val()) || 0 : 0,
                wc_inch: $('input[name="useCholesterol"]:checked').val() === '0' ? parseFloat($('#wc').val()) || 0 : 0,
                ht: $('input[name="useCholesterol"]:checked').val() === '0' ? parseFloat($('#bdh').val()) || 0 : 0,
                hasStrokeHistory: $('#chk-stroke').is(':checked')
            };
            
            const wc_cm = inputs.wc_inch * 2.54;
            const whr = (wc_cm > 0 && inputs.ht > 0) ? wc_cm / inputs.ht : 0;
            const clamped = {
                age: Math.max(30, Math.min(inputs.age, 70)),
                sbp: Math.max(70, Math.min(inputs.sbp, 220)),
                tc: inputs.tc > 0 ? Math.min(inputs.tc, 280) : 0,
                whr: whr, wc_cm: wc_cm
            };

            let [ , predicted_risk, , compare_risk ] = TASCVDformular(clamped.age, inputs.smoke, inputs.dm, clamped.sbp, inputs.sex, clamped.tc, clamped.whr, clamped.wc_cm);

            let riskPercent = predicted_risk * 100;
            let ratio = 0;

            if (inputs.hasStrokeHistory) {
                riskPercent = 40.00;
            } else {
                if (riskPercent > 30) riskPercent = 30.00;
                if (compare_risk > 0) ratio = predicted_risk / compare_risk;
            }

            const classification = classifyRisk(riskPercent);

            return {
                riskPercentText: riskPercent.toFixed(2),
                barValue: Math.min(riskPercent, 30),
                riskGroup: inputs.hasStrokeHistory ? "สูงอันตราย (มีประวัติสโตรก)" : classification.text,
                riskColor: inputs.hasStrokeHistory ? "#b00020" : classification.color,
                compareRatio: (ratio > 0 && !inputs.hasStrokeHistory) ? ratio.toFixed(1) : 'N/A',
                hasStrokeHistory: inputs.hasStrokeHistory,
                inputs: inputs
            };
        }

        function TASCVDformular(age, smoke, dm, sbp, sex, tc, whr, wc) { 
            var sur_root = 0.964588; 
            var full_score = 0, compare_score = 0;
            var c_sbp = (sex==1 && age>60)?132 : (sex==0 && age<=60)?115 : (sex==0 && age>60)?130 : 120;
            var c_whr = sex==0 ? 0.52667 : 0.58125; 
            var c_wc = sex==0 ? 79 : 93;
            if (tc > 0) { 
                full_score = (0.08183 * age) + (0.39499 * sex) + (0.02084 * sbp) + (0.69974 * dm) + (0.00212 * tc) + (0.41916 * smoke); 
                compare_score = (0.08183 * age) + (0.39499 * sex) + (0.02084 * c_sbp) + (0.00212 * 200); 
                return calc(full_score, 7.04423, compare_score);
            } else if (whr > 0) { 
                full_score = (0.079 * age) + (0.128 * sex) + (0.019350987 * sbp) + (0.58454 * dm) + (3.512566 * whr) + (0.459 * smoke); 
                compare_score = (0.079 * age) + (0.128 * sex) + (0.019350987 * c_sbp) + (3.512566 * c_whr); 
                return calc(full_score, 7.712325, compare_score);
            } else if (wc > 0) { 
                full_score = (0.08372 * age) + (0.05988 * sex) + (0.02034 * sbp) + (0.59953 * dm) + (0.01283 * wc) + (0.459 * smoke); 
                compare_score = (0.08372 * age) + (0.05988 * sex) + (0.02034 * c_sbp) + (0.01283 * c_wc); 
                return calc(full_score, 7.31047, compare_score);
            } 
            return [0,0,0,0];
            function calc(score, mean, c_score) {
                let risk = 1 - (Math.pow(sur_root, Math.exp(score - mean)));
                let c_risk = 1 - (Math.pow(sur_root, Math.exp(c_score - mean)));
                return [score, risk, c_score, c_risk];
            }
        }

        function classifyRisk(p) {
            if (p < 10) return { text: "ต่ำ", color: "#28a745" };
            if (p < 20) return { text: "ปานกลาง", color: "#ffc107" };
            if (p < 30) return { text: "สูง", color: "#fd7e14" };
            return { text: "สูงมาก/อันตราย", color: "#dc3545" };
        }
